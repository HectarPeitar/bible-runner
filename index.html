<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Book Order</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 1.5rem;
        font-family: system-ui, sans-serif;
      }
      .after {
        font-size: 1.2rem;
      }
      .row {
        display: flex;
        gap: 1rem;
        margin-top: 8rem;
        transition: transform 60ms linear;
      }
      .gate {
        flex: 1;
        min-height: 6rem;
        padding: 1rem;
        font: inherit;
        font-size: 1.5rem;
        cursor: pointer;
      }
      .gate.marked {
        outline: 0.3rem solid #2a7;
        background: #dfd;
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
