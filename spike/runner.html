<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Book Order — movement spike</title>
    <style>
      :root {
        --lane: 12rem;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0d1117;
        color: #e6edf3;
        font-family: system-ui, sans-serif;
      }
      #stage {
        position: relative;
        width: calc(var(--lane) * 3);
        height: 100%;
        margin: 0 auto;
        overflow: hidden;
        background: linear-gradient(#0d1117, #161b22 60%, #0d1117);
      }
      /* The hit line: where a row is judged. */
      #stage::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 22%;
        border-top: 2px dashed #2f81f7;
        opacity: 0.5;
      }
      .row {
        position: absolute;
        left: 0;
        right: 0;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.5rem;
        padding: 0 0.5rem;
        will-change: transform;
      }
      .gate {
        height: 4.5rem;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 0.25rem;
        border-radius: 0.75rem;
        border: 2px solid #30363d;
        background: #1f2630;
        font-size: 1.05rem;
        line-height: 1.15;
        overflow-wrap: anywhere;
      }
      .row.judged .gate.right { border-color: #2ea043; background: #12261a; }
      .row.judged .gate.wrong { border-color: #f85149; background: #2d1416; }
      #player {
        position: absolute;
        bottom: 12%;
        width: calc(100% / 3);
        height: 3rem;
        will-change: transform;
        transition: transform 90ms ease-out;
      }
      #player::after {
        content: "▮";
        display: block;
        text-align: center;
        font-size: 2.5rem;
        color: #2f81f7;
      }
      #hud {
        position: absolute;
        top: 0.75rem;
        left: 0.75rem;
        right: 0.75rem;
        display: flex;
        justify-content: space-between;
        font-variant-numeric: tabular-nums;
        pointer-events: none;
      }
      #after {
        position: absolute;
        bottom: 26%;
        left: 0;
        right: 0;
        text-align: center;
        color: #8b949e;
        pointer-events: none;
      }
      #over {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 1rem;
        text-align: center;
        background: #0d1117ee;
      }
      #over[hidden] { display: none; }
      #shake { position: absolute; inset: 0; pointer-events: none; }
      .shaking #shake { animation: shake 220ms; }
      @keyframes shake {
        0%, 100% { transform: translate(0, 0); }
        25% { transform: translate(-0.5rem, 0.25rem); }
        50% { transform: translate(0.5rem, -0.25rem); }
        75% { transform: translate(-0.25rem, -0.25rem); }
      }
      kbd {
        border: 1px solid #30363d;
        border-bottom-width: 2px;
        border-radius: 0.25rem;
        padding: 0.1rem 0.35rem;
        font: inherit;
        font-size: 0.85em;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="shake"></div>
      <div id="hud"><span id="score">0</span><span id="speed">1.0×</span></div>
      <div id="after"></div>
      <div id="player"></div>
      <div id="over" hidden>
        <h1>Caught</h1>
        <p id="final"></p>
        <p><kbd>Enter</kbd> to run again</p>
      </div>
    </div>

    <script>
      // Spike only: proves travelling gates + keyboard steering at 60fps with DOM/CSS.
      const BOOKS = [
        'Genesis', 'Exodus', 'Leviticus', 'Numbers', 'Deuteronomy', 'Joshua', 'Judges',
        'Ruth', '1 Samuel', '2 Samuel', '1 Kings', '2 Kings', '1 Chronicles', '2 Chronicles',
        'Ezra', 'Nehemiah', 'Esther', 'Job', 'Psalms', 'Proverbs', 'Ecclesiastes',
        'Song of Solomon', 'Isaiah', 'Jeremiah', 'Lamentations', 'Ezekiel', 'Daniel',
        'Hosea', 'Joel', 'Amos', 'Obadiah', 'Jonah', 'Micah', 'Nahum', 'Habakkuk',
        'Zephaniah', 'Haggai', 'Zechariah', 'Malachi',
      ];

      const LANES = 3;
      const TRAVEL_MS = 2600; // a row takes this long to reach the hit line at 1×
      const ROW_GAP_PX = 210;
      const STUMBLES = 2; // second stumble within the window catches you

      const stage = document.getElementById('stage');
      const player = document.getElementById('player');
      const after = document.getElementById('after');
      const scoreEl = document.getElementById('score');
      const speedEl = document.getElementById('speed');
      const over = document.getElementById('over');
      const final = document.getElementById('final');

      let lane = 1;
      let speed = 1;
      let score = 0;
      let nextBook = 1; // index into BOOKS still to reach
      let rows = [];
      let running = true;
      let stumbleAt = -Infinity;
      let last = 0;
      let seed = 12345;

      const rand = () => {
        seed = (seed + 0x6d2b79f5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };

      function drawRow(row) {
        const el = document.createElement('div');
        el.className = 'row';
        row.gates.forEach((name, i) => {
          const gate = document.createElement('div');
          gate.className = 'gate';
          gate.textContent = name;
          if (i === row.answerLane) gate.dataset.right = 'yes';
          el.append(gate);
        });
        stage.append(el);
        row.el = el;
        moveRow(row);
      }

      function moveRow(row) {
        row.el.style.transform = `translate3d(0, ${row.y}px, 0)`;
      }

      function newRow() {
        const answer = BOOKS[nextBook % BOOKS.length];
        const pool = BOOKS.filter((b) => b !== answer);
        const a = pool[Math.floor(rand() * pool.length)];
        let b = pool[Math.floor(rand() * pool.length)];
        while (b === a) b = pool[Math.floor(rand() * pool.length)];
        const answerLane = Math.floor(rand() * LANES);
        const gates = [a, b];
        gates.splice(answerLane, 0, answer);
        const row = { y: -120, gates, answerLane, answer, judged: false };
        drawRow(row);
        return row;
      }

      function setLane(next) {
        lane = Math.max(0, Math.min(LANES - 1, next));
        player.style.transform = `translate3d(${lane * 100}%, 0, 0)`;
      }

      function judge(row) {
        row.judged = true;
        const gates = row.el.children;
        gates[row.answerLane].classList.add('right');
        if (lane === row.answerLane) {
          score += Math.round(100 * speed);
          nextBook += 1;
          speed = Math.min(4, speed + 0.08);
          scoreEl.textContent = String(score);
          speedEl.textContent = speed.toFixed(1) + '×';
          after.textContent = 'After ' + row.answer;
        } else {
          gates[lane].classList.add('wrong');
          const now = performance.now();
          if (now - stumbleAt < 2200) return end('Caught after a second stumble');
          stumbleAt = now;
          speed = Math.max(1, speed - 0.35);
          speedEl.textContent = speed.toFixed(1) + '×';
          stage.classList.add('shaking');
          setTimeout(() => stage.classList.remove('shaking'), 240);
        }
      }

      function end(reason) {
        running = false;
        final.textContent = reason + ' — scored ' + score + ' over ' + nextBook + ' Books';
        over.hidden = false;
      }

      const HIT_LINE = () => stage.clientHeight * 0.22;

      function frame(now) {
        if (!running) return;
        const dt = last === 0 ? 0 : Math.min(now - last, 100);
        last = now;
        if (dt > 0) {
          const pxPerMs = (stage.clientHeight - HIT_LINE()) / (TRAVEL_MS / speed);
          for (const row of rows) {
            row.y += pxPerMs * dt;
            moveRow(row);
            if (!row.judged && row.y + 72 >= stage.clientHeight - HIT_LINE()) judge(row);
          }
          rows = rows.filter((row) => {
            if (row.judged && row.y > stage.clientHeight + 200) {
              row.el.remove();
              return false;
            }
            return true;
          });
          const lastRow = rows[rows.length - 1];
          if (lastRow === undefined || lastRow.y > ROW_GAP_PX) rows.push(newRow());
        }
        requestAnimationFrame(frame);
      }

      addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !running) {
          location.reload();
          return;
        }
        const left = e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A';
        const right = e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D';
        if (left) setLane(lane - 1);
        if (right) setLane(lane + 1);
        if (left || right) e.preventDefault();
      });

      setLane(1);
      after.textContent = 'After ' + BOOKS[0];
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
