<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Book Order — perspective spike</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #07090d;
        color: #e6edf3;
        font-family: system-ui, sans-serif;
      }
      #stage {
        position: relative;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(120% 80% at 50% 22%, #16202e 0%, #0a0f16 55%, #05070a 100%);
      }
      /* The road, in perspective: full width at the player, converging at the horizon. */
      #road {
        position: absolute;
        inset: 0;
        clip-path: polygon(2% 100%, 98% 100%, 50% 24%);
        background: linear-gradient(#11161d 0%, #1a222c 45%, #0f151c 100%);
        opacity: 0.9;
      }
      #road::before {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(to bottom, transparent 0 38px, #24303d 38px 40px);
        mask-image: linear-gradient(to bottom, transparent 26%, black 62%);
        opacity: 0.55;
      }
      #horizon {
        position: absolute;
        left: 0;
        right: 0;
        top: 24%;
        height: 1px;
        background: linear-gradient(90deg, transparent, #2f81f7, transparent);
        opacity: 0.5;
      }
      .gate {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 0.2rem 0.35rem;
        border-radius: 0.6rem;
        border: 2px solid #33475e;
        background: #17202b;
        transform-origin: 50% 50%;
        will-change: transform, opacity, width, height;
        white-space: nowrap;
        line-height: 1.05;
      }
      .gate.right { border-color: #2ea043; background: #0f2517; box-shadow: 0 0 1.5rem #2ea04366; }
      .gate.wrong { border-color: #f85149; background: #2a1316; }
      #player {
        position: absolute;
        z-index: 9000;
        left: 50%;
        bottom: 5%;
        width: 8rem;
        height: 2.4rem;
        margin-left: -4rem;
        display: grid;
        place-items: center;
        border-radius: 0.5rem;
        background: #2f81f733;
        border: 2px solid #2f81f7;
        color: #cfe4ff;
        font-size: 1.1rem;
        transition: left 90ms ease-out;
        will-change: left;
      }
      #hud {
        position: absolute;
        z-index: 9200;
        top: 0.75rem;
        left: 0.9rem;
        right: 0.9rem;
        display: flex;
        justify-content: space-between;
        color: #8b949e;
        font-variant-numeric: tabular-nums;
      }
      #hud b { color: #e6edf3; }
      #after {
        position: absolute;
        z-index: 9100;
        top: 2.6rem;
        left: 0;
        right: 0;
        text-align: center;
        color: #9fb0c3;
        font-size: 1.1rem;
        pointer-events: none;
      }
      #over {
        position: absolute;
        z-index: 9500;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 0.75rem;
        text-align: center;
        background: #05070aee;
      }
      #over[hidden] { display: none; }
      kbd {
        border: 1px solid #30363d;
        border-bottom-width: 2px;
        border-radius: 0.25rem;
        padding: 0.1rem 0.35rem;
        font: inherit;
        font-size: 0.85em;
      }
      #stage.shaking #road,
      #stage.shaking #player { animation: shake 200ms; }
      @keyframes shake {
        0%, 100% { translate: 0 0; }
        25% { translate: -0.6rem 0.2rem; }
        50% { translate: 0.6rem -0.2rem; }
        75% { translate: -0.3rem -0.2rem; }
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="road"></div>
      <div id="horizon"></div>
      <div id="after"></div>
      <div id="player">▲</div>
      <div id="hud"><span>Score <b id="score">0</b></span><span>Speed <b id="speed">1.0×</b></span></div>
      <div id="over" hidden>
        <h1>Caught</h1>
        <p id="final"></p>
        <p><kbd>Enter</kbd> to run again</p>
      </div>
    </div>

    <script>
      // Spike: perspective projection in DOM/CSS. World units measured from the
      // player along the road; the renderer projects z into a screen y and size.
      const BOOKS = [
        'Genesis', 'Exodus', 'Leviticus', 'Numbers', 'Deuteronomy', 'Joshua', 'Judges',
        'Ruth', '1 Samuel', '2 Samuel', '1 Kings', '2 Kings', '1 Chronicles', '2 Chronicles',
        'Ezra', 'Nehemiah', 'Esther', 'Job', 'Psalms', 'Proverbs', 'Ecclesiastes',
        'Song of Solomon', 'Isaiah', 'Jeremiah', 'Lamentations', 'Ezekiel', 'Daniel',
        'Hosea', 'Joel', 'Amos', 'Obadiah', 'Jonah', 'Micah', 'Nahum', 'Habakkuk',
        'Zephaniah', 'Haggai', 'Zechariah', 'Malachi',
      ];

      const LANES = 3;
      const ROW_SPACING = 2000;   // world units between rows
      const SPAWN_Z = 6000;       // farthest row on screen: four rows of anticipation
      const PERSPECTIVE = 4200;   // larger = flatter, smaller = more dramatic
      const ROAD_AT_PLAYER = 0.76;
      const HORIZON = 0.24;
      const PLAYER_Y = 0.86;
      const MIN_SCALE = 0.34;
      const TRAVEL_MS = 9000;     // a row takes this long to reach the player at 1×
      const MAX_SPEED = 2.4;

      const stage = document.getElementById('stage');
      const player = document.getElementById('player');
      const after = document.getElementById('after');
      const scoreEl = document.getElementById('score');
      const speedEl = document.getElementById('speed');
      const over = document.getElementById('over');
      const final = document.getElementById('final');

      let lane = 1;
      let speed = 1;
      let score = 0;
      let chain = 1;            // index in BOOKS of the next answer to place on the road
      let nextBook = 1;         // index of the Book the player must reach next
      let rows = [];            // nearest first
      let running = true;
      let stumbleAt = -Infinity;
      let last = 0;
      let seed = 20260214;

      const rand = () => {
        seed = (seed + 0x6d2b79f5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };

      const scaleOf = (z) => PERSPECTIVE / (PERSPECTIVE + Math.max(0, z));
      const yOf = (z, h) => h * (HORIZON + (PLAYER_Y - HORIZON) * scaleOf(z));

      function projectRow(row) {
        const h = stage.clientHeight;
        const w = stage.clientWidth;
        // Past the player a row keeps its size and slides down and away.
        const s = row.z < 0 ? 1 : scaleOf(row.z);
        const y = row.z < 0
          ? h * (PLAYER_Y + Math.min(0.16, -row.z / 9000))
          : yOf(row.z, h);
        const fade = Math.min(1, Math.max(0, (s - MIN_SCALE * 0.5) / (MIN_SCALE * 0.5)));
        const laneWidth = (w * ROAD_AT_PLAYER * s) / LANES;
        // Text is sized for reading, not for perspective: a name you cannot read
        // ahead is a name you meet too late, which defeats the view.
        const boxW = Math.min(320, laneWidth * 0.94);
        const boxH = 30 + 32 * s;
        const font = 12 + 8 * s;
        row.gates.forEach((gate, i) => {
          const x = w / 2 + (i - (LANES - 1) / 2) * laneWidth;
          gate.el.style.width = boxW + 'px';
          gate.el.style.height = boxH + 'px';
          // Keep a long name on one line: shrink the text to fit its box.
          const fit = boxW / Math.max(4, gate.name.length * 0.56);
          gate.el.style.fontSize = Math.min(font, fit) + 'px';
          gate.el.style.transform = `translate3d(${x - boxW / 2}px, ${y - boxH / 2}px, 0)`;
          gate.el.style.opacity = String(fade);
          // Nearer rows on top, and never negative or the road hides them.
          gate.el.style.zIndex = String(8000 - Math.round(row.z));
        });
      }

      /** Names already visible on the road, so no Book appears twice at once. */
      function namesOnRoad() {
        const seen = new Set();
        for (const row of rows) for (const name of row.gates.map((g) => g.name)) seen.add(name);
        return seen;
      }

      function buildRow(answerName, answerLane, gates, z) {
        const row = { z, gates: [], answerLane, answer: answerName, judged: false };
        gates.forEach((name, i) => {
          const el = document.createElement('div');
          el.className = 'gate';
          el.textContent = name;
          el.dataset.right = i === answerLane ? 'yes' : 'no';
          stage.append(el);
          row.gates.push({ el, name });
        });
        rows.push(row);
        projectRow(row);
        return row;
      }

      /** One row, placed at `z`, with the chain's next answer and two distractors. */
      function newRow(z = SPAWN_Z) {
        const answer = BOOKS[chain % BOOKS.length];
        const answerIndex = chain % BOOKS.length;
        const banned = namesOnRoad();
        // The queued answers are known, so a distractor can never be a future answer.
        for (let i = 0; i < Math.ceil(SPAWN_Z / ROW_SPACING); i += 1) {
          banned.add(BOOKS[(chain + i) % BOOKS.length]);
        }
        // Distractors: nearby canon (the answer's own Section would be the real rule).
        const pool = BOOKS.filter((name, i) => {
          if (name === answer || banned.has(name)) return false;
          return Math.abs(i - answerIndex) <= 6;
        });
        const fallback = BOOKS.filter((name) => name !== answer && !banned.has(name));
        const from = pool.length >= 2 ? pool : fallback;
        const a = from[Math.floor(rand() * from.length)];
        let b = from[Math.floor(rand() * from.length)];
        while (b === a) b = from[Math.floor(rand() * from.length)];
        const answerLane = Math.floor(rand() * LANES);
        const gates = [a, b];
        gates.splice(answerLane, 0, answer);
        chain += 1;
        return buildRow(answer, answerLane, gates, z);
      }

      function setLane(next) {
        lane = Math.max(0, Math.min(LANES - 1, next));
        const w = stage.clientWidth;
        const laneWidth = (w * ROAD_AT_PLAYER) / LANES;
        player.style.left = w / 2 + (lane - 1) * laneWidth + 'px';
      }

      function judge(row) {
        row.judged = true;
        row.gates[row.answerLane].el.classList.add('right');
        if (lane === row.answerLane) {
          score += Math.round(100 * speed);
          nextBook = BOOKS.indexOf(row.answer) + 1;
          speed = Math.min(MAX_SPEED, speed + 0.08);
          scoreEl.textContent = String(score);
          speedEl.textContent = speed.toFixed(1) + '×';
          after.textContent = 'After ' + row.answer;
        } else {
          row.gates[lane].el.classList.add('wrong');
          const now = performance.now();
          if (now - stumbleAt < 2000) return end('Caught after a second stumble');
          stumbleAt = now;
          speed = Math.max(1, speed - 0.4);
          speedEl.textContent = speed.toFixed(1) + '×';
          stage.classList.add('shaking');
          setTimeout(() => stage.classList.remove('shaking'), 210);
        }
      }

      function end(reason) {
        running = false;
        final.textContent = `${reason} — scored ${score} over ${nextBook} Books`;
        over.hidden = false;
      }

      function frame(now) {
        if (!running) return;
        const dt = last === 0 ? 0 : Math.min(now - last, 100);
        last = now;
        if (dt > 0) {
          const dzPerMs = (SPAWN_Z / TRAVEL_MS) * speed;
          for (const row of rows) {
            row.z -= dzPerMs * dt;
            if (!row.judged && row.z <= 0) judge(row);
            projectRow(row);
          }
          rows = rows.filter((row) => {
            if (row.z < -900) {
              row.gates.forEach((g) => g.el.remove());
              return false;
            }
            return true;
          });
          const farthest = rows[rows.length - 1];
          if (farthest === undefined || farthest.z < SPAWN_Z - ROW_SPACING) newRow();
        }
        requestAnimationFrame(frame);
      }

      addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !running) { location.reload(); return; }
        const left = e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A';
        const right = e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D';
        if (left) setLane(lane - 1);
        if (right) setLane(lane + 1);
        if (left || right) e.preventDefault();
      });

      addEventListener('resize', () => setLane(lane));

      // Seed the road so the first frame already shows the approach.
      for (let i = 0; i <= 3; i += 1) newRow(i * ROW_SPACING);
      nextBook = 1;
      setLane(1);
      after.textContent = 'After ' + BOOKS[0];
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
